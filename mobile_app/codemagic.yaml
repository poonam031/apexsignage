workflows:
  ios-workflow:
    name: iOS Build & Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build iOS without code signing
        script: |
          flutter build ios --release --no-codesign
      - name: Package Payload as IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q ApexSignage.ipa Payload
          cp ApexSignage.ipa ../../../ || true
          cp -r Runner.app ../../../ || true
    artifacts:
      - "*.ipa"
      - "*.app"
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app
      - mobile_app/build/ios/iphoneos/*.ipa
      - mobile_app/build/ios/iphoneos/Runner.app
      - $CM_BUILD_DIR/*.ipa
      - $CM_BUILD_DIR/**/*.ipa
    publishing:
      email:
        recipients:
          - poonammali312001@gmail.com
        notify:
          success: true
          failure: true

  android-workflow:
    name: Android Build APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android APK
        script: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/*.apk ../ || true
    artifacts:
      - "*.apk"
      - build/app/outputs/flutter-apk/*.apk
      - mobile_app/build/app/outputs/flutter-apk/*.apk
      - $CM_BUILD_DIR/*.apk
      - $CM_BUILD_DIR/**/*.apk
    publishing:
      email:
        recipients:
          - poonammali312001@gmail.com
        notify:
          success: true
          failure: true
